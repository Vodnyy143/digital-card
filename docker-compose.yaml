services:
  db:
    image: postgres:18.1-alpine
    container_name: card-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-card}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-card}
      POSTGRES_DB: ${DB_NAME:-card}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-card}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  db_data:
